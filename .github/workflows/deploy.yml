name: build-and-deploy
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/shlok695/portfolio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, svps]
    concurrency: deploy-portfolio
    steps:
      - name: Deploy, smoke test, roll back on failure
        run: |
          cd /home/shlok/portfolio
          PREV=$(grep '^TAG=' .env | cut -d= -f2)
          sed -i "s/^TAG=.*/TAG=${{ github.sha }}/" .env
          docker compose pull && docker compose up -d
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3003 && exit 0
            sleep 5
          done
          echo "Smoke test failed, rolling back to $PREV"
          sed -i "s/^TAG=.*/TAG=$PREV/" .env
          docker compose up -d
          exit 1