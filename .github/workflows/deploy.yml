name: build-and-deploy
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
     uses: shlok695/homelab-infra/.github/workflows/build-scan-push.yml@3de57193a7945125535c40b6d56a1af7fb617e08
     with:
       image: ghcr.io/shlok695/portfolio
       push: ${{ github.event_name == 'push' }}
    
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, svps]
    concurrency: deploy-portfolio
    steps:
      - name: Deploy, smoke test, roll back on failure
        run: |
          cd /home/shlok/portfolio
          PREV=$(grep '^TAG=' .env | cut -d= -f2)
          sed -i "s/^TAG=.*/TAG=${{ github.sha }}/" .env
          docker compose pull && docker compose up -d
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3003 && exit 0
            sleep 5
          done
          echo "Smoke test failed, rolling back to $PREV"
          sed -i "s/^TAG=.*/TAG=$PREV/" .env
          docker compose up -d
          exit 1