name: build-and-deploy
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/shlok695/portfolio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<pinned>
      - uses: docker/setup-buildx-action@<pinned>
      - uses: docker/build-push-action@<pinned>
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@<pinned-commit-sha>
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - if: github.event_name == 'push'
        uses: docker/login-action@<pinned>
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, svps]
    concurrency: deploy-portfolio
    steps:
      - name: Deploy, smoke test, roll back on failure
        run: |
          cd /home/shlok/portfolio
          PREV=$(grep '^TAG=' .env | cut -d= -f2)
          sed -i "s/^TAG=.*/TAG=${{ github.sha }}/" .env
          docker compose pull && docker compose up -d
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3003 && exit 0
            sleep 5
          done
          echo "Smoke test failed, rolling back to $PREV"
          sed -i "s/^TAG=.*/TAG=$PREV/" .env
          docker compose up -d
          exit 1
